[project]
name = "mcp-cloudflare-crunchtools"
version = "0.5.1"
description = "Secure MCP server for Cloudflare DNS, Transform Rules, Page Rules, Cache, Analytics, and WAF"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [
    { name = "crunchtools.com" }
]
readme = "README.md"
keywords = ["mcp", "cloudflare", "dns", "fastmcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.28",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
mcp-cloudflare-crunchtools = "mcp_cloudflare_crunchtools:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_cloudflare_crunchtools"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "C4", "C901", "DTZ", "T10", "ISC", "PIE", "PT", "RET", "SIM", "TID", "TCH", "ARG", "PLC", "PLE", "PLR", "PLW", "TRY", "RUF"]
ignore = [
    # Genuinely project-wide; not individually reviewed line-by-line, and
    # awaiting a fleet-wide ruff policy decision rather than a per-repo call.
    # See gourmand-exceptions.toml (EV002) for the classification rationale.
    "TRY003",   # long exception messages outside the exception class (3 files)
    "PLR0913",  # too many arguments (5 files: server.py + 4 tools/*.py) --
                # MCP tool signatures take one parameter per Cloudflare API
                # field by design, mirroring the wire API
    "PLR0917",  # too many POSITIONAL arguments -- identical call sites to
                # PLR0913 (same underlying pattern, different pylint counter)
    "TID252",   # relative imports within the package (7 files under tools/)
]

[tool.ruff.lint.pylint]
max-branches = 10
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "PLC0415", "PLR2004"]
# Deferred import avoiding a circular import with .tools.zones; the only
# function-local import outside tests/.
"src/mcp_cloudflare_crunchtools/server.py" = ["PLC0415"]
# HTTP status codes (401, 403, 404, 429) as literals in the status-code
# dispatch; the only place outside tests/ comparing against these numbers.
"src/mcp_cloudflare_crunchtools/client.py" = ["PLR2004", "PLW0603"]
# Module-global singleton accessor (get_config), the same idiom as
# client.py's get_client.
"src/mcp_cloudflare_crunchtools/config.py" = ["PLW0603"]
# Empty exception-class bodies (docstring-only subclasses of UserError).
"src/mcp_cloudflare_crunchtools/errors.py" = ["PIE790"]
# __all__ grouped by tool category (Zones/DNS/Transform/Page Rules/Cache),
# not alphabetically; the only __all__ in the project.
"src/mcp_cloudflare_crunchtools/tools/__init__.py" = ["RUF022"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
